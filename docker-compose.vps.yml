# Container logs are capped so a busy month cannot fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Two identical backend workers behind Caddy (sticky per API key). Rolling
# deploys restart one at a time: deploy/rolling-deploy.sh.
x-backend: &backend
  image: vynor-backend:local
  build:
    context: ./backend
    dockerfile: Dockerfile
  logging: *default-logging
  restart: unless-stopped
  # Shared by both workers. Postgres is the system of record (DATABASE_URL);
  # this only holds local files such as the dev SQLite database.
  volumes:
    - vynor-backend-data:/app/data
  environment:
    - PORT=3333
    - ADMIN_PORT=3334
    - NODE_ENV=production
    - BASE_URL=https://vynor.lk
    - REDIS_URL=redis://vynor-redis:6379
    # Tier routing runs in-process (ROUTER_MODE=classifier). The llama.cpp
    # SLM is optional: start it with --profile slm and set ROUTER_MODE=slm.
    - ROUTER_MODE=classifier
    - LOCAL_SLM_ENABLED=false
    - LOCAL_SLM_URL=http://vynor-slm:8080/v1
    - LOCAL_SLM_MODEL=qwen2.5-coder-1.5b-instruct
    - LOCAL_SLM_TIMEOUT_MS=1500
    - SEMANTIC_CACHE_ENABLED=true
    - LOCAL_EMBED_URL=http://vynor-embed:8081/v1
    - LOCAL_EMBED_MODEL=bge-small-en-v1.5
  env_file:
    - ./backend/.env
  depends_on:
    vynor-postgres:
      condition: service_healthy
    vynor-redis:
      condition: service_started
    vynor-embed:
      condition: service_started
  mem_limit: 768m
  networks:
    - vynor-net
  # Agent responses stream for minutes; let them finish on deploy.
  stop_grace_period: 75s
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3333/ready > /dev/null || exit 1"]
    interval: 5s
    timeout: 3s
    start_period: 20s
    retries: 3

services:
  # ── 0. Caddy: HTTPS for vynor.lk (API) and admin.vynor.lk (admin portal) ────
  vynor-caddy:
    image: caddy:2-alpine
    container_name: vynor-caddy
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - vynor-caddy-data:/data
      - vynor-caddy-config:/config
    depends_on:
      - vynor-backend
      - vynor-backend-2
    mem_limit: 128m
    networks:
      - vynor-net

  # ── 1. VynorAI Cloud Backend: two workers ───────────────────────────────────
  vynor-backend:
    <<: *backend
    container_name: vynor-backend
    # Only Caddy is public; localhost binding keeps curl health checks and
    # admin scripts working against worker 1.
    ports:
      - "127.0.0.1:3333:3333"
      - "127.0.0.1:3334:3334"

  vynor-backend-2:
    <<: *backend
    container_name: vynor-backend-2

  # ── 1b. PostgreSQL: the system of record (users, billing, usage, admin) ─────
  # Private to vynor-net; never published. DATABASE_URL in backend/.env.
  vynor-postgres:
    image: postgres:16-alpine
    container_name: vynor-postgres
    logging: *default-logging
    restart: unless-stopped
    environment:
      - POSTGRES_DB=vynor
      - POSTGRES_USER=vynor
    env_file:
      - ./deploy/postgres.env # POSTGRES_PASSWORD only
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c random_page_cost=1.1
      -c max_connections=60
      -c wal_compression=on
    volumes:
      - vynor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vynor -d vynor"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
    networks:
      - vynor-net

  # ── 1c. Nightly logical backups to ./backups (14 days kept) ─────────────────
  vynor-pg-backup:
    image: postgres:16-alpine
    container_name: vynor-pg-backup
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - ./deploy/postgres.env # POSTGRES_PASSWORD only
    environment:
      - PGHOST=vynor-postgres
      - PGUSER=vynor
      - PGDATABASE=vynor
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        while true; do
          until pg_isready -q; do sleep 5; done
          f=/backups/vynor-$$(date -u +%Y%m%d-%H%M%S).dump
          if pg_dump -Fc -f "$$f.part"; then mv "$$f.part" "$$f"; echo "backup ok $$f"; else rm -f "$$f.part"; echo "backup FAILED"; fi
          find /backups -name 'vynor-*.dump' -mtime +14 -delete
          sleep 86400
        done
    volumes:
      - ./backups:/backups
    depends_on:
      vynor-postgres:
        condition: service_healthy
    mem_limit: 128m
    networks:
      - vynor-net

  # ── 2. Dedicated Low-Latency Redis ─────────────────────────────────────────
  vynor-redis:
    image: redis:7-alpine
    container_name: vynor-redis
    logging: *default-logging
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - vynor-redis-data:/data
    networks:
      - vynor-net

  # ── 3. Local SLM: tier router + background summarizer (Qwen 2.5 Coder 1.5B) ──
  # 8192 ctx / 2 slots = 4096 tokens per slot: one slot for routing, one for
  # conversation summaries (~3k-token transcripts). ~1.2 GB RAM incl. KV cache.
  vynor-slm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: vynor-slm
    # Off by default: the in-process classifier routes better and costs no RAM.
    profiles: ["slm"]
    logging: *default-logging
    restart: unless-stopped
    command: >
      -m /models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
      --host 0.0.0.0
      --port 8080
      -c 16384
      -t 2
      --parallel 4
    volumes:
      - ./models:/models:ro
    mem_limit: 3g
    # Leave 2 of the 4 vCPUs to the backend and Postgres: under load the
    # router falls back to rules anyway, so the SLM must never starve them.
    cpus: 2
    networks:
      - vynor-net

  # ── 4. Embeddings for the semantic cache (bge-small, ~150 MB RAM) ──────────
  vynor-embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: vynor-embed
    logging: *default-logging
    restart: unless-stopped
    command: >
      -m /models/bge-small-en-v1.5-q8_0.gguf
      --host 0.0.0.0
      --port 8081
      --embeddings
      -c 512
      -t 1
    # The image's built-in check probes :8080; this server listens on :8081.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./models:/models:ro
    mem_limit: 384m
    networks:
      - vynor-net

volumes:
  vynor-redis-data:
  vynor-backend-data:
  vynor-postgres-data:
  vynor-caddy-data:
  vynor-caddy-config:

networks:
  vynor-net:
    driver: bridge
