services:
  # â”€â”€ 0. Caddy: HTTPS for vynor.lk (API) and admin.vynor.lk (admin portal) â”€â”€â”€â”€
  vynor-caddy:
    image: caddy:2-alpine
    container_name: vynor-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - vynor-caddy-data:/data
      - vynor-caddy-config:/config
    depends_on:
      - vynor-backend
    mem_limit: 128m
    networks:
      - vynor-net

  # â”€â”€ 1. VynorAI Cloud Backend â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  vynor-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vynor-backend
    restart: unless-stopped
    # Only Caddy is public; localhost binding keeps curl health checks working.
    ports:
      - "127.0.0.1:3333:3333"
      - "127.0.0.1:3334:3334"
    # SQLite lives here; without this volume every rebuild wipes users and payments.
    volumes:
      - vynor-backend-data:/app/data
    environment:
      - PORT=3333
      - ADMIN_PORT=3334
      - NODE_ENV=production
      - BASE_URL=https://vynor.lk
      - REDIS_URL=redis://vynor-redis:6379
      - LOCAL_SLM_ENABLED=true
      - LOCAL_SLM_URL=http://vynor-slm:8080/v1
      - LOCAL_SLM_MODEL=qwen2.5-coder-1.5b-instruct
      - LOCAL_SLM_TIMEOUT_MS=1500
      - SEMANTIC_CACHE_ENABLED=true
      - LOCAL_EMBED_URL=http://vynor-embed:8081/v1
      - LOCAL_EMBED_MODEL=bge-small-en-v1.5
    env_file:
      - ./backend/.env
    depends_on:
      - vynor-redis
      - vynor-slm
      - vynor-embed
    mem_limit: 768m
    networks:
      - vynor-net

  # â”€â”€ 2. Dedicated Low-Latency Redis â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  vynor-redis:
    image: redis:7-alpine
    container_name: vynor-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - vynor-redis-data:/data
    networks:
      - vynor-net

  # â”€â”€ 3. Local SLM: tier router + background summarizer (Qwen 2.5 Coder 1.5B) â”€â”€
  # 8192 ctx / 2 slots = 4096 tokens per slot: one slot for routing, one for
  # conversation summaries (~3k-token transcripts). ~1.2 GB RAM incl. KV cache.
  vynor-slm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: vynor-slm
    restart: unless-stopped
    command: >
      -m /models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
      --host 0.0.0.0
      --port 8080
      -c 8192
      -t 3
      --parallel 2
    volumes:
      - ./models:/models:ro
    mem_limit: 2g
    networks:
      - vynor-net

  # â”€â”€ 4. Embeddings for the semantic cache (bge-small, ~150 MB RAM) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  vynor-embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: vynor-embed
    restart: unless-stopped
    command: >
      -m /models/bge-small-en-v1.5-q8_0.gguf
      --host 0.0.0.0
      --port 8081
      --embeddings
      -c 512
      -t 1
    volumes:
      - ./models:/models:ro
    mem_limit: 384m
    networks:
      - vynor-net

volumes:
  vynor-redis-data:
  vynor-backend-data:
  vynor-caddy-data:
  vynor-caddy-config:

networks:
  vynor-net:
    driver: bridge
