<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VynorAI sign in</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <p>Completing sign-in…</p>
    <script>
      (function () {
        function complete() {
          var message = JSON.stringify({ callbackUrl: window.location.href });
          try {
            Office.context.ui.messageParent(message, { targetOrigin: window.location.protocol + "//" + window.location.host });
          } catch (_) {
            Office.context.ui.messageParent(message);
          }
        }
        if (Office.onReady) Office.onReady(complete);
        else Office.initialize = complete;
      })();
    </script>
  </body>
</html>
