<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VynorAI Excel</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; background: #ffffff; }
      body { font: 14px system-ui, sans-serif; color: #1f2937; }
      main { min-height: 100vh; padding: 20px; background: #ffffff; }
      h1 { margin: 0 0 16px; font-size: 28px; color: #102a4c; }
      h2 { margin: 22px 0 8px; font-size: 20px; color: #102a4c; }
      #status { min-height: 20px; margin: 0 0 12px; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      button { margin: 0; padding: 9px 12px; border: 1px solid #64748b; border-radius: 4px; background: #ffffff; color: #102a4c; font: inherit; cursor: pointer; }
      button:hover:not(:disabled) { background: #eff6ff; }
      button:disabled { cursor: not-allowed; opacity: .5; }
      label { display: block; margin: 0 0 6px; font-weight: 600; }
      textarea { width: 100%; min-height: 76px; margin: 0 0 10px; padding: 9px; border: 1px solid #64748b; border-radius: 4px; resize: vertical; font: inherit; }
      pre { margin: 0; white-space: pre-wrap; background: #f3f4f6; padding: 10px; max-height: 320px; overflow: auto; }
      #diagnostics { color: #1f2937; font-size: 12px; }
      #diagnostics-summary { min-height: 18px; margin: 8px 0; font-weight: 600; }
      .actions + .actions { margin-top: 8px; }
      #apply:disabled { opacity: .5; }
    </style>
  </head>
  <body>
    <main>
      <h1>VynorAI Excel</h1>
      <p id="status" role="status" aria-live="polite">Loading…</p>
      <label for="instruction">What should VynorAI create?</label>
      <textarea id="instruction" placeholder="For example: Create a chart and PivotTable on a new result sheet."></textarea>
      <div class="actions">
        <button id="sign-in" type="button">Sign in with Microsoft</button>
        <button id="sign-out" type="button" disabled>Sign out</button>
        <button id="inspect" type="button">Inspect and preview</button>
        <button id="apply" type="button" disabled>Confirm and apply</button>
      </div>
      <h2>Preview</h2>
      <pre id="preview">No preview yet.</pre>
      <h2>Diagnostics</h2>
      <div class="actions">
        <button id="self-test" type="button">Run self-test</button>
        <button id="copy-diagnostics" type="button">Copy diagnostics</button>
        <button id="clear-diagnostics" type="button">Clear</button>
      </div>
      <p id="diagnostics-summary" aria-live="polite"></p>
      <pre id="diagnostics">No sign-in diagnostics yet.</pre>
    </main>
    <script>
      (function () {
        var status = document.getElementById("status");
        var diagnostics = document.getElementById("diagnostics");
        function note(message) {
          if (window.__VYNORAI_DIAG_NOTE__) return window.__VYNORAI_DIAG_NOTE__(message);
          if (!diagnostics) return;
          var prior = diagnostics.textContent === "No sign-in diagnostics yet." ? "" : diagnostics.textContent + "\n";
          diagnostics.textContent = prior + new Date().toISOString() + " " + message;
        }
        window.addEventListener("error", function (event) {
          // Office can raise this generic event for a cross-origin hosted script even
          // while the task pane and its sign-in dialog are functioning correctly.
          if (event.message === "Script error.") {
            note("Non-fatal external script event reported by the Excel WebView.");
            return;
          }
          if (event.message) {
            note("Startup error: " + event.message);
            if (status) status.textContent = "Add-in startup failed: " + event.message;
          }
        });
        window.addEventListener("unhandledrejection", function (event) {
          note("Unhandled startup rejection: " + (event.reason && event.reason.message ? event.reason.message : "unknown"));
          if (status) status.textContent = "Add-in startup failed. Update Excel or use Excel for the web.";
        });
        window.setTimeout(function () {
          if (status && status.textContent === "Loading…") {
            note("Task pane bundle did not initialize within five seconds.");
            status.textContent = "Add-in scripts did not start. Close and reopen the task pane.";
          }
        }, 5000);
      })();
    </script>
    <script nomodule>
      document.getElementById("status").textContent = "This Excel version needs a current Microsoft Edge WebView2 update. Use Excel for the web to continue now.";
    </script>
    <script src="./runtime-config.js?v=20261015.10"></script>
    <script src="./dist/taskpane.bundle.js?v=20261015.10"></script>
  </body>
</html>
