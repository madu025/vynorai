<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VynorAI Excel</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 16px; color: #1f2937; }
      button { margin: 4px 4px 8px 0; padding: 8px 12px; }
      pre { white-space: pre-wrap; background: #f3f4f6; padding: 10px; max-height: 320px; overflow: auto; }
      #diagnostics { color: #7f1d1d; font-size: 12px; }
      #apply:disabled { opacity: .5; }
    </style>
  </head>
  <body>
    <h1>VynorAI Excel</h1>
    <p id="status" role="status" aria-live="polite">Loading…</p>
    <button id="sign-in" type="button">Sign in with Microsoft</button>
    <button id="inspect" type="button">Inspect selected data</button>
    <button id="apply" type="button" disabled>Confirm and apply</button>
    <h2>Preview</h2>
    <pre id="preview">No preview yet.</pre>
    <h2>Diagnostics</h2>
    <pre id="diagnostics">No sign-in diagnostics yet.</pre>
    <script>
      (function () {
        var status = document.getElementById("status");
        window.addEventListener("error", function (event) {
          if (status && event.message) status.textContent = "Add-in startup failed: " + event.message;
        });
        window.addEventListener("unhandledrejection", function () {
          if (status) status.textContent = "Add-in startup failed. Update Excel or use Excel for the web.";
        });
      })();
    </script>
    <script nomodule>
      document.getElementById("status").textContent = "This Excel version needs a current Microsoft Edge WebView2 update. Use Excel for the web to continue now.";
    </script>
    <script src="./runtime-config.js?v=20261014.6"></script>
    <script src="./dist/taskpane.bundle.js?v=20261014.6"></script>
  </body>
</html>
