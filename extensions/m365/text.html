<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VynorAI Writing</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      :root { --ink: #1b2a41; --muted: #64748b; --line: #dbe2ea; --bg: #fafafa; --card: #ffffff; --brand: #123a6b; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--bg); }
      body { font: 14px/1.45 "Segoe UI", system-ui, sans-serif; color: var(--ink); }
      main { padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 12px; }
      [hidden] { display: none !important; }
      .brand { font-weight: 600; font-size: 15px; }
      #status { margin: 0; padding: 8px 12px; border-radius: 10px; background: #eef2f7; min-height: 36px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
      button { font: inherit; cursor: pointer; border-radius: 10px; padding: 8px 14px; border: 1px solid var(--line); background: transparent; color: inherit; }
      button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      select, textarea { width: 100%; font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--card); }
      textarea { min-height: 110px; resize: vertical; }
      label { display: block; margin: 8px 0 4px; font-weight: 600; }
      label.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; }
      .muted { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
      body[data-auth="out"] .work { display: none; }
      body[data-auth="in"] #signin-card { display: none; }
    </style>
  </head>
  <body>
    <main>
      <span class="brand">VynorAI Writing</span>
      <p id="status" role="status" aria-live="polite">Loading…</p>

      <section id="signin-card" class="card">
        <p>Sign in with your work account to get writing help in this document.</p>
        <button id="sign-in" class="primary" type="button">Sign in with Microsoft</button>
      </section>

      <div class="work">
        <section class="card">
          <label for="task">What should happen?</label>
          <select id="task"></select>
          <label for="tone">Tone</label>
          <select id="tone">
            <option value="">Keep as is</option>
            <option value="formal">Formal</option>
            <option value="friendly">Friendly</option>
            <option value="concise">Concise</option>
          </select>
          <div class="row">
            <button id="read" type="button" disabled>Read selection</button>
          </div>
        </section>

        <section class="card">
          <label for="source">Text that will be sent</label>
          <textarea id="source" placeholder="Select text in your document, then click Read selection."></textarea>
          <p id="size" class="muted"></p>
          <label class="check"><input id="consent" type="checkbox" /> <span>I agree to send this text to the VynorAI writing service.</span></label>
          <div class="row">
            <button id="run" class="primary" type="button" disabled>Generate</button>
          </div>
        </section>

        <section class="card">
          <label for="output">Result</label>
          <textarea id="output" readonly></textarea>
          <p id="notes" class="muted"></p>
          <p class="muted">Nothing in your document changes until you insert it. Nothing is ever sent as an email.</p>
          <div class="row">
            <button id="insert" type="button" disabled>Insert (nothing is replaced)</button>
            <button id="copy" type="button" disabled>Copy</button>
            <button id="sign-out" type="button" hidden>Sign out</button>
          </div>
        </section>
      </div>
    </main>
    <script src="./runtime-config.js?v=20261015.22"></script>
    <script src="./dist/text.bundle.js?v=20261015.22"></script>
  </body>
</html>
